<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flightline UPS Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Flightline Sync</h1>
        <div id="page-kind" class="page-kind">Checking page…</div>
      </div>
      <button id="settings-toggle" class="icon-button" type="button" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <button id="sync" type="button" class="primary">Sync</button>
    <p id="status" class="status" aria-live="polite"></p>

    <section id="settings-panel" class="settings hidden">
      <label for="tracker-url">Flightline Tracker URL</label>
      <input id="tracker-url" type="url" placeholder="https://tracker.example.com" autocomplete="url">

      <label for="sync-token">Sync token</label>
      <input id="sync-token" type="password" placeholder="SCHEDULE_SYNC_TOKEN" autocomplete="off">

      <label for="jumpseat-airport">Jumpseat home airport</label>
      <input id="jumpseat-airport" maxlength="4" value="DFW" placeholder="DFW">
      <label class="check"><input id="jumpseat-only-home" type="checkbox" checked> Only import confirmed jumpseats touching this airport</label>

      <div class="row">
        <button id="save" type="button" class="secondary">Save settings</button>
        <button id="test" type="button" class="secondary">Test connection</button>
      </div>
      <details>
        <summary>Safety / privacy</summary>
        <p>Nothing is clicked, searched, booked, cancelled, or polled on UPS. The extension reads the current visible page only after you press Sync. If screen reading is uncertain it asks for Ctrl+A / Ctrl+C as a fallback.</p>
      </details>
    </section>
  </main>
  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
