services:
  tracker:
    image: ${TRACKER_IMAGE:-ghcr.io/YOUR_GITHUB_USER/flightline-tracker:stable}
    container_name: flightline-tracker
    restart: unless-stopped
    ports:
      - "${TRACKER_PORT:-8765}:8080"
    environment:
      APP_DATA_DIR: /data
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-auto}"
      ADMIN_SESSION_MINUTES: "30"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      WEATHER_ARCHIVE_INTERVAL_MINUTES: "${WEATHER_ARCHIVE_INTERVAL_MINUTES:-60}"
      WEATHER_ARCHIVE_MAX_PER_FLIGHT: "${WEATHER_ARCHIVE_MAX_PER_FLIGHT:-24}"
      WEATHER_ARCHIVE_MAX_MB: "${WEATHER_ARCHIVE_MAX_MB:-250}"
    volumes:
      - ${TRACKER_DATA_PATH:-/volume1/docker/flightline-tracker/data}:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
